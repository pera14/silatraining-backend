name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # prisma generate / unit tests only need a syntactically valid URL; e2e uses Testcontainers
      DATABASE_URL: postgresql://sila:sila@localhost:5432/sila
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sila/contracts build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Supertest against a real Postgres 16 (Testcontainers; Docker is available on ubuntu-latest)
      - run: pnpm test:e2e
